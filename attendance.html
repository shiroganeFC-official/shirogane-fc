<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>出欠確認 | オープンキャンパス</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Noto Sans JP', sans-serif; background-color: #f9fafb; margin: 0; padding: 10px; color: #111827; }
        
        .header-container { max-width: 1000px; margin: 10px auto 20px; display: flex; justify-content: space-between; align-items: center; }
        .back-btn { font-size: 0.8rem; color: #2563eb; font-weight: 700; text-decoration: none; border: 1px solid #2563eb; padding: 4px 12px; border-radius: 20px; transition: all 0.2s; }
        .back-btn:hover { background: #2563eb; color: white; }

        .section-title { max-width: 1000px; margin: 30px auto 10px; font-size: 1.1rem; font-weight: 900; color: #111827; display: flex; align-items: center; }
        .section-title::before { content: ""; display: inline-block; width: 4px; height: 1.2em; background: #2563eb; margin-right: 8px; border-radius: 2px; }

        .table-container { max-width: 1000px; margin: 0 auto 30px; background: white; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); overflow-x: auto; }
        table { width: 100%; border-collapse: separate; border-spacing: 0; min-width: 600px; } 
        
        th { background-color: #111827 !important; padding: 12px 8px; font-size: 0.85rem; color: #ffffff !important; font-weight: 900; text-align: center; border-bottom: 2px solid #000; }
        td { padding: 12px 8px; border-bottom: 1px solid #f3f4f6; font-size: 0.9rem; text-align: center; color: #374151; }

        /* 列幅の固定（ここが揃えるポイント） */
        .col-name   { width: 20%; text-align: left; padding-left: 15px; font-weight: 700; }
        .col-setup  { width: 12%; }
        .col-status { width: 15%; font-weight: 800; }
        .col-car    { width: 12%; }
        .col-remarks { width: 23%; text-align: left; font-size: 0.8rem; }
        .col-time   { width: 18%; font-size: 0.7rem; color: #9ca3af; }

        .btn-setup { background: #eff6ff; color: #2563eb; font-weight: 800; padding: 4px 12px; border-radius: 6px; font-size: 0.75rem; border: 1px solid #dbeafe; transition: all 0.2s; }
        .btn-setup:hover { background: #2563eb; color: white; }

        /* モーダルデザイン */
        #modal { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.7); z-index:1000; align-items:center; justify-content:center; }
        .modal-content { background:white; width:90%; max-width:400px; padding:30px; border-radius:24px; color:#111827; }
        .input-label { display:block; font-size:0.8rem; font-weight:800; color:#6b7280; margin-bottom:5px; margin-top:15px; }
        .modal-input { width:100%; padding:12px; border:1px solid #e5e7eb; border-radius:10px; font-size:1rem; outline:none; }
        .modal-input:focus { border-color:#2563eb; ring:2px; ring-color:#dbeafe; }
        .save-btn { width:100%; background:#111827; color:white; padding:16px; border-radius:14px; font-weight:700; margin-top:25px; transition: opacity 0.2s; }
        .cancel-btn { width:100%; background:transparent; color:#6b7280; padding:10px; font-size:0.9rem; margin-top:5px; }

        /* 出欠ステータスの色分け */
        .status-出席 { color: #059669; }
        .status-欠席 { color: #dc2626; }
    </style>
</head>
<body>

    <div class="header-container">
        <div>
            <h1 id="target-date" class="text-xl font-black text-gray-900">読み込み中...</h1>
        </div>
        <a href="list.html" class="back-btn">← 予定一覧へ</a>
    </div>

    <h3 class="section-title">役員</h3>
    <div class="table-container">
        <table id="guardian-list">
            <thead>
                <tr>
                    <th class="col-name">名前</th>
                    <th class="col-setup">設定</th>
                    <th class="col-status">出欠</th>
                    <th class="col-car">車出し</th>
                    <th class="col-remarks">備考</th>
                    <th class="col-time">更新日時</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>

    <h3 class="section-title">監督・コーチ</h3>
    <div class="table-container">
        <table id="coach-list">
            <thead>
                <tr>
                    <th class="col-name">名前</th>
                    <th class="col-setup">設定</th>
                    <th class="col-status">出欠</th>
                    <th class="col-car">車出し</th>
                    <th class="col-remarks">備考</th>
                    <th class="col-time">更新日時</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>

    <h3 class="section-title">選手</h3>
    <div class="table-container">
        <table id="player-list">
            <thead>
                <tr>
                    <th class="col-name">名前</th>
                    <th class="col-setup">設定</th>
                    <th class="col-status">出欠</th>
                    <th class="col-car">車出し</th>
                    <th class="col-remarks">備考</th>
                    <th class="col-time">更新日時</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>

    <div id="modal">
        <div class="modal-content">
            <h2 id="modal-name" class="text-2xl font-black mb-4 border-b-4 border-blue-600 inline-block px-1">氏名</h2>
            
            <label class="input-label">出欠ステータス</label>
            <select id="input-status" class="modal-input">
                <option value="出席">出席</option>
                <option value="欠席">欠席</option>
                <option value="未定">未定</option>
            </select>

            <label class="input-label">車出し</label>
            <div class="flex items-center gap-2 p-2 bg-gray-50 rounded-lg">
                <input type="checkbox" id="input-car" class="w-5 h-5">
                <span class="text-sm font-bold">配車可能</span>
            </div>

            <label class="input-label">備考</label>
            <input type="text" id="input-remarks" class="modal-input" placeholder="遅刻・早退など">
            
            <button onclick="saveData()" class="save-btn">この内容で登録する</button>
            <button onclick="closeModal()" class="cancel-btn">キャンセル</button>
        </div>
    </div>

<script>
    const GSS_URL = 'https://script.google.com/macros/s/AKfycbwTNgQ4Axd7QzTxj5zMTM9zYFlpsGiuTz1AxDjfFOu76O2M1OtDUTAH6-pY7duotm7Eow/exec';
    let currentTargetName = "";
    const params = new URLSearchParams(window.location.search);
    const dateStr = params.get('date');

    window.onload = () => {
        document.getElementById('target-date').innerText = dateStr ? `${dateStr} の出欠` : "日付未選択";
        
        fetch(GSS_URL + "?action=getMembers")
            .then(res => res.json())
            .then(members => {
                renderTables(members);
                return fetch(GSS_URL + "?action=getLogs");
            })
            .then(res => res.json())
            .then(logs => {
                fillLogs(logs, dateStr);
            })
            .catch(err => console.error(err));
    };

    function renderTables(members) {
        const containers = { 'guardian': '#guardian-list tbody', 'coach': '#coach-list tbody', 'player': '#player-list tbody' };
        members.forEach(m => {
            const tbody = document.querySelector(containers[m.status]);
            if (tbody) {
                tbody.insertAdjacentHTML('beforeend', `
                    <tr>
                        <td class="col-name">${m.name}</td>
                        <td class="col-setup"><button class="btn-setup" onclick="openModal('${m.name}')">設定</button></td>
                        <td class="status col-status">-</td>
                        <td class="car col-car">-</td>
                        <td class="remarks col-remarks">-</td>
                        <td class="timestamp col-time">-</td>
                    </tr>`);
            }
        });
    }

    function fillLogs(logs, targetDate) {
        const rows = document.querySelectorAll('tr');
        logs.forEach(log => {
            let logDateStr = "";
            const d = new Date(log.date);
            if (!isNaN(d.getTime())) {
                logDateStr = d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, '0') + "-" + String(d.getDate()).padStart(2, '0');
            }

            if (logDateStr === targetDate) {
                rows.forEach(tr => {
                    if (tr.cells[0] && tr.cells[0].innerText === log.name) {
                        const sEl = tr.querySelector('.status');
                        sEl.innerText = log.status || "-";
                        sEl.className = `status col-status status-${log.status}`; // 色分け用
                        tr.querySelector('.car').innerText = log.car_support === "可能" ? "🚗" : "-";
                        tr.querySelector('.remarks').innerText = log.remarks || "-";
                        tr.querySelector('.timestamp').innerText = log.timestamp || "-";
                    }
                });
            }
        });
    }

    function openModal(name) {
        currentTargetName = name;
        document.getElementById('modal-name').innerText = name;
        document.getElementById('modal').style.display = 'flex';
    }

    function closeModal() { document.getElementById('modal').style.display = 'none'; }

    function saveData() {
        const payload = {
            date: dateStr,
            name: currentTargetName,
            status: document.getElementById('input-status').value,
            car_support: document.getElementById('input-car').checked ? "可能" : "不可",
            remarks: document.getElementById('input-remarks').value
        };

        fetch(GSS_URL, {
            method: 'POST',
            mode: 'no-cors', 
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        })
        .then(() => {
            alert("登録完了しました！");
            closeModal();
            location.reload();
        })
        .catch(err => {
            alert("ネットワークエラーが発生しました。");
        });
    }
</script>
</body>
</html>
