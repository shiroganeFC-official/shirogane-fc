<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>スケジュール | オープンキャンパス</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js'></script>
    
    <style>
        /* 1. 基本設定 */
        body { font-family: 'Noto Sans JP', sans-serif; background-color: #f9fafb; margin: 0; }
        
        /* 2. カレンダーの見た目 */
/* カレンダー全体のフォントサイズを底上げ */
#calendar { 
    max-width: 900px; 
    margin: 10px auto; 
    background: white; 
    padding: 10px; 
    border-radius: 12px;
    box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    /* 最小サイズを 0.7 -> 0.85rem に引き上げ */
    font-size: clamp(0.85rem, 2.5vw, 1rem) !important;
}

/* 1マスの最小の高さを確保して縦長にする */
.fc .fc-daygrid-day {
    min-height: 100px !important; /* マスに高さを出して視認性を確保 */
}

/* 日付の数字を大きく、太く */
.fc .fc-daygrid-day-number { 
    font-size: 1rem !important; 
    font-weight: 800; 
    padding: 6px !important;
}

/* 予定（イベント）のラベルを読みやすく */
.fc-event {
    padding: 2px 4px !important;
    font-weight: 700 !important;
    border-radius: 4px !important;
    margin-top: 2px !important;
}

/* ツールバー（年月表示）をさらに強調 */
.fc .fc-toolbar-title { 
    font-size: 1.4rem !important; 
    font-weight: 900; 
    letter-spacing: -0.02em;
}

        /* 3. モーダルの見た目調整（中央配置と開閉制御） */
            #event-modal { 
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background: rgba(0, 0, 0, 0.8); 
                z-index: 9999;
                
                /* これで画面の真ん中にピタリと配置されます */
                display: flex;
                align-items: center;
                justify-content: center;
                
                /* 初期状態は非表示 */
                visibility: hidden;
                opacity: 0;
                transition: opacity 0.3s, visibility 0.3s;
            }
        
        /* 表示用クラス */
        #event-modal.show {
            visibility: visible;
            opacity: 1;
        }

.modal-content {
    background: white;
    width: 90%;          /* スマホでの横幅 */
    max-width: 380px;    /* 以前より少し広げます */
    padding: 32px 24px;  /* 上下のパディングを増やしてゆとりを持たせます */
    border-radius: 28px;
    box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    
    /* ★中身のテキストや要素を中央に寄せます */
    text-align: center;
    
    /* アニメーション */
    transform: scale(0.9);
    transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
}

        #event-modal.show .modal-content {
            transform: scale(1);
        }

        #modal-date-display { font-size: 1.4rem; font-weight: 900; color: #111827; margin-bottom: 20px; }

        .badge-type {
            display: inline-block;
            background: #2563eb;
            color: white;
            padding: 4px 14px;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 800;
            margin-bottom: 15px;
        }

        .info-group { margin-bottom: 20px; text-align: left; } /* 行間を少し広げます */
        .info-label {
            display: block;
            font-size: 14px;      /* 以前より大幅に大きくします (10px -> 14px) */
            font-weight: 800;     /* さらに太く */
            color: #4b5563;      /* 少し濃いグレーにしてコントラストを上げます (gray-400 -> gray-600) */
            letter-spacing: 0.05em; /* 文字間隔を少し詰めて読みやすく */
            margin-bottom: 4px;   /* ラベルと値の間隔を少し空けます */
        }
        .info-value { display: block; font-size: 1.2rem; font-weight: 700; color: #1f2937; line-height: 1.5; }        .highlight-value { font-size: 1.3rem; font-weight: 900; color: #000; border-left: 4px solid #2563eb; padding-left: 10px; }


        .close-btn {
            margin-top: 20px; width: 100%; background: #111827;
            color: white; padding: 16px; border-radius: 18px;
            font-weight: 700; font-size: 1rem;
        }

        /* 日曜日（Sunday）の列をうっすら赤に */
        .fc-day-sun {
            background-color: rgba(255, 0, 0, 0.05) !important;
        }

        /* 土曜日（Saturday）の列をうっすら青に */
        .fc-day-sat {
            background-color: rgba(0, 0, 255, 0.05) !important;
        }

        /* 日曜日・土曜日の日付の数字の色も微調整（お好みで） */
        .fc-day-sun .fc-daygrid-day-number {
            color: #ef4444; /* 赤 */
        }
        .fc-day-sat .fc-daygrid-day-number {
            color: #3b82f6; /* 青 */
        }
    </style>
</head>
<body>

    <div id='calendar'></div>

    <div id="event-modal">
        <div class="modal-content">
            <div id="modal-date-display"></div>
            <span id="modal-type" class="badge-type"></span>
            
            <div class="info-group">
                <span class="info-label">対象</span>
                <span id="event-target" class="info-value highlight-value"></span>
            </div>
            <div class="info-group">
                <span class="info-label">内容</span>
                <span id="event-name" class="info-value"></span>
            </div>
            <div class="info-group">
                <span class="info-label">時間</span>
                <span id="event-time" class="info-value"></span>
            </div>
            <div class="info-group">
                <span class="info-label">場所</span>
                <span id="event-location" class="info-value"></span>
            </div>
            <div class="info-group">
                <span class="info-label">備考</span>
                <span id="event-remarks" class="info-value text-gray-500 font-normal text-sm"></span>
            </div>
            
            <button onclick="closeModal()" class="close-btn">閉じる</button>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            var calendarEl = document.getElementById('calendar');
            var calendar = new FullCalendar.Calendar(calendarEl, {
                initialView: 'dayGridMonth',
                locale: 'ja',
                height: 'auto',
                events: 'https://script.google.com/macros/s/AKfycbwTNgQ4Axd7QzTxj5zMTM9zYFlpsGiuTz1AxDjfFOu76O2M1OtDUTAH6-pY7duotm7Eow/exec',
                eventClick: function(info) {
                    var p = info.event.extendedProps;
                    var fmt = function(t) {
                        if(!t) return '--:--';
                        var d = new Date(t);
                        return isNaN(d.getTime()) ? t : d.getHours().toString().padStart(2,'0')+':'+d.getMinutes().toString().padStart(2,'0');
                    };

                    document.getElementById('modal-date-display').innerText = info.event.startStr;
                    document.getElementById('modal-type').innerText = p.type || '予定';
                    document.getElementById('event-target').innerText = info.event.title || '---';
                    document.getElementById('event-name').innerText = p.eventName || '---';
                    document.getElementById('event-time').innerText = fmt(p.startTime) + ' 〜 ' + fmt(p.endTime);
                    document.getElementById('event-location').innerText = p.location || '---';
                    document.getElementById('event-remarks').innerText = p.remarks || '---';

                    // showクラスを追加して中央表示
                    document.getElementById('event-modal').classList.add('show');
                }
            });
            calendar.render();
        });

        function closeModal() {
            // showクラスを削除して非表示
            document.getElementById('event-modal').classList.remove('show');
        }
    </script>
</body>
</html>
