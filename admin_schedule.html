<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>白金FC | スケジュール管理パネル</title>
    <link rel="stylesheet" href="style.css"> <style>
        /* 管理画面専用の追加スタイル */
        body { background-color: #f4f7f9; padding: 50px 0; font-family: 'Noto Sans JP', sans-serif; }
        .admin-container { max-width: 800px; margin: 0 auto; }
        
        .admin-card {
            background: #fff;
            border: 2.5px solid rgba(0, 51, 102, 0.2);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
        }

        .form-title { color: #003366; font-weight: 900; margin-bottom: 30px; border-left: 5px solid #003366; padding-left: 15px; }
        
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .full-width { grid-column: span 2; }

        .form-group label { display: block; font-weight: bold; margin-bottom: 8px; color: #333; font-size: 0.9rem; }
        .form-group input, .form-group textarea {
            width: 100%; padding: 12px; border: 1.5px solid #ddd; border-radius: 8px; font-size: 1rem;
        }

        /* 学年選択チップ */
        .grade-selector { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 5px; }
        .chip { cursor: pointer; }
        .chip input { display: none; }
        .chip span {
            display: inline-block; padding: 8px 15px; border: 1.5px solid #ddd; border-radius: 50px;
            font-size: 0.85rem; font-weight: bold; transition: 0.3s;
        }
        .chip input:checked + span { background: #003366; color: #fff; border-color: #003366; }

        .submit-btn {
            width: 100%; padding: 15px; background: #003366; color: white; border: none;
            border-radius: 10px; font-size: 1.1rem; font-weight: bold; cursor: pointer;
            transition: 0.3s; margin-top: 20px;
        }
        .submit-btn:hover { background: #00509e; transform: translateY(-2px); }
        .submit-btn:disabled { background: #ccc; cursor: not-allowed; }

        #response-message { margin-top: 20px; text-align: center; font-weight: bold; }
    </style>
</head>
<body>

    

<div class="admin-container">
    <div class="admin-card">
        <h2 class="form-title">SCHEDULE MANAGER</h2>
        
        <form id="schedule-form">
            <div class="form-grid">
                <div class="form-group">
                    <label>日付</label>
                    <input type="date" name="date" required>
                </div>

                <div></div>

                <div class="form-group">
                    <label>開始時間</label>
                    <input type="time" name="start_time" required>
                </div>
                <div class="form-group">
                    <label>終了時間</label>
                    <input type="time" name="end_time" required>
                </div>

                <div class="form-group full-width">
                    <label>対象学年（複数選択可）</label>
                    <div class="grade-selector">
                        <label class="chip"><input type="checkbox" name="target" value="U-7"><span>U-7</span></label>
                        <label class="chip"><input type="checkbox" name="target" value="U-8"><span>U-8</span></label>
                        <label class="chip"><input type="checkbox" name="target" value="U-9"><span>U-9</span></label>
                        <label class="chip"><input type="checkbox" name="target" value="U-10"><span>U-10</span></label>
                        <label class="chip"><input type="checkbox" name="target" value="U-11"><span>U-11</span></label>
                        <label class="chip"><input type="checkbox" name="target" value="U-12"><span>U-12</span></label>
                        <label class="chip"><input type="checkbox" name="target" value="ALL"><span>全学年</span></label>
                    </div>
                </div>

                <div class="form-group full-width">
                    <label>イベント名</label>
                    <input type="text" name="event_name" placeholder="例：通常練習 / 練習試合" required>
                </div>

                <div class="form-group full-width">
                    <label>場所</label>
                    <input type="text" name="location" placeholder="例：白金小グラウンド">
                </div>

                <div class="form-group full-width">
                    <label>備考</label>
                    <textarea name="remarks" rows="3" placeholder="持ち物や雨天連絡など"></textarea>
                </div>
            </div>

            <button type="submit" id="submit-btn" class="submit-btn">Google連携で登録を実行</button>
            <div id="response-message"></div>
        </form>
    </div>
</div>

<script>
    // ★ここに取得した「ウェブアプリURL」を貼り付けてください
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxGkIepOVz0suNNfnQE14L1AEXNx4DcwbfQmdSQ1UH1kO5qLrzSoXjJVWFj8qqYhtDC4g/exec";

    document.getElementById('schedule-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const btn = document.getElementById('submit-btn');
        const msg = document.getElementById('response-message');
        
        btn.disabled = true;
        btn.innerText = "送信中...";
        msg.innerText = "";

        const formData = new FormData(e.target);
        const data = {
            date: formData.get('date'),
            start_time: formData.get('start_time'),
            end_time: formData.get('end_time'),
            event_name: formData.get('event_name'),
            location: formData.get('location'),
            remarks: formData.get('remarks'),
            target: Array.from(formData.getAll('target')).join(', ')
        };

        try {
            // GASへデータを送信
            const response = await fetch(WEB_APP_URL, {
                method: 'POST',
                body: JSON.stringify(data)
            });
            
            const result = await response.json();
            
            if (result.status === 'success') {
                msg.style.color = "#28a745";
                msg.innerText = "Awesome! データベースに保存されました。";
                e.target.reset();
            } else {
                throw new Error(result.message);
            }
        } catch (error) {
            msg.style.color = "#dc3545";
            msg.innerText = "エラー: " + error.message;
        } finally {
            btn.disabled = false;
            btn.innerText = "Google連携で登録を実行";
        }
    });
</script>

</body>
</html>
