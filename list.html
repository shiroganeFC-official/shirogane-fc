<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>予定一覧 | 白金FC</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Noto Sans JP', sans-serif; background-color: #f9fafb; margin: 0; padding: 10px; overflow-x: hidden; color: #111827; }
        .fixed-header { position: sticky; top: 0; background-color: #f9fafb; z-index: 30; padding-bottom: 10px; }
        .header-top { max-width: 1000px; margin: 10px auto 10px; display: flex; justify-content: space-between; align-items: center; }
        .back-btn { font-size: 0.8rem; color: #2563eb; font-weight: 700; text-decoration: none; border: 1px solid #2563eb; padding: 4px 10px; border-radius: 20px; transition: all 0.2s; }
        .back-btn:hover { background: #2563eb; color: white; }
        .schedule-nav { max-width: 1000px; margin: 0 auto; display: flex; justify-content: center; align-items: center; gap: 8px; }
        .nav-btn { background: #fff; border: 1px solid #e5e7eb; padding: 4px 10px; border-radius: 8px; font-weight: 900; color: #2563eb; transition: all 0.2s; }
        .select-date { font-size: clamp(1rem, 4vw, 1.3rem); font-weight: 900; color: #111827; background: transparent; border: none; outline: none; cursor: pointer; border-radius: 6px; }
        
        .table-container { max-width: 1000px; margin: 0 auto; background: white; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        table { width: 100%; border-collapse: separate; border-spacing: 0; table-layout: fixed; } 
        th { position: sticky; top: 105px; background-color: #111827 !important; padding: 12px 4px; font-size: clamp(0.65rem, 2.5vw, 0.95rem); color: #ffffff !important; font-weight: 900 !important; border-bottom: 2px solid #000; text-align: left; z-index: 15; }
        td { padding: 8px 4px; border-bottom: 1px solid #e5e7eb; vertical-align: top; font-size: clamp(0.7rem, 2.5vw, 0.95rem); line-height: 1.3; text-align: left; }
        
        .event-item { padding: 6px 0; }
        .event-item + .event-item { border-top: 1.5px dashed #9ca3af; margin-top: 4px; padding-top: 10px; }

        .col-date   { width: 13%; text-align: right; padding-right: 8px; font-weight: 900; }
        .col-type   { width: 12%; text-align: center; }
        .col-time   { width: 18%; font-weight: 700; }
        .col-target { width: 18%; font-weight: 800; color: #111827; }
        .col-name   { width: 24%; color: #374151; font-weight: 500; } 
        .col-loc    { width: 15%; color: #6b7280; } 

        .date-link { color: #2563eb; text-decoration: underline; font-weight: 900; display: inline-block; padding: 2px 4px; }
        .row-sun td { background-color: #fff1f2 !important; color: #ef4444; }
        .row-sat td { background-color: #eff6ff !important; color: #3b82f6; }
        
        .type-tag { display: inline-block; background: #e0e7ff; color: #4338ca; padding: 2px 6px; border-radius: 4px; font-size: 0.7rem; font-weight: 800; }
        .has-event { cursor: pointer; }

        @media (max-width: 767px) {
            .col-name, .col-loc { display: none; }
            .col-date   { width: 18%; }
            .col-type   { width: 22%; }
            .col-time   { width: 25%; }
            .col-target { width: 35%; }
            td { padding: 14px 4px; vertical-align: middle; }
        }

        /* モーダル */
        #event-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.8); z-index: 9999; display: flex; align-items: center; justify-content: center; visibility: hidden; opacity: 0; transition: opacity 0.3s; }
        #event-modal.show { visibility: visible; opacity: 1; }
        .modal-content { background: white; width: 95%; max-width: 420px; padding: 30px 25px; border-radius: 30px; transform: scale(0.9); transition: transform 0.3s; max-height: 85vh; overflow-y: auto; }
        #event-modal.show .modal-content { transform: scale(1); }
        .modal-date-header { font-size: 1.5rem; font-weight: 900; color: #111827; border-bottom: 4px solid #2563eb; display: inline-block; padding: 0 8px 4px; margin-bottom: 30px; }
        .modal-event-card { text-align: left; }
        .modal-event-card + .modal-event-card { margin-top: 25px; padding-top: 25px; border-top: 2px dashed #e5e7eb; }
        .m-info-group { display: flex; align-items: flex-start; margin-bottom: 14px; gap: 12px; }
        .m-icon-box { width: 40px; height: 40px; border-radius: 10px; background: #f3f4f6; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        .m-type-emoji { font-size: 1.5rem; }
        .m-text-box { flex-grow: 1; }
        .m-label { display: block; font-size: 0.75rem; font-weight: 800; color: #6b7280; margin-bottom: 1px; }
        .m-value { display: block; font-size: 1.05rem; font-weight: 700; color: #1f2937; }
        .m-value-highlight { font-size: 1.2rem; color: #111827; font-weight: 800; border-left: 4px solid #2563eb; padding-left: 10px; margin-left: -14px; }
        .close-btn { margin-top: 35px; width: 100%; background: #111827; color: white; padding: 16px; border-radius: 16px; font-weight: 900; font-size: 1.1rem; }
    </style>
</head>
<body>

    <div class="fixed-header">
        <div class="header-top">
            <h1 class="text-xl font-black">予定一覧</h1>
            <a href="index.html" class="back-btn">← 戻る</a>
        </div>
        <div class="schedule-nav">
            <button class="nav-btn" onclick="changeMonth(-1)">＜</button>
            <div class="flex items-center">
                <select id="select-year" class="select-date" onchange="jumpToDate()"></select>
                <span class="font-black mr-1 ml-1">年</span>
                <select id="select-month" class="select-date" onchange="jumpToDate()"></select>
                <span class="font-black ml-1">月</span>
            </div>
            <button class="nav-btn" onclick="changeMonth(1)">＞</button>
        </div>
    </div>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th class="col-date">日付</th>
                    <th class="col-type">種別</th>
                    <th class="col-time">時間</th>
                    <th class="col-target">対象</th>
                    <th class="col-name">内容</th>
                    <th class="col-loc">場所</th>
                </tr>
            </thead>
            <tbody id="table-body"></tbody>
        </table>
    </div>

    <div id="event-modal">
        <div class="modal-content text-center">
            <div class="modal-date-header" id="modal-date-display"></div>
            <div id="modal-events-container"></div>
            <button onclick="closeModal()" class="close-btn">閉じる</button>
        </div>
    </div>

    <script>
        const url = 'https://script.google.com/macros/s/AKfycbwTNgQ4Axd7QzTxj5zMTM9zYFlpsGiuTz1AxDjfFOu76O2M1OtDUTAH6-pY7duotm7Eow/exec';
        let currentViewDate = new Date(); 
        let allEvents = [];

        function initSelects() {
            const yearSelect = document.getElementById('select-year');
            const monthSelect = document.getElementById('select-month');
            const currentYear = new Date().getFullYear();
            for (let i = currentYear - 1; i <= currentYear + 2; i++) {
                const opt = document.createElement('option'); opt.value = i; opt.innerText = i; yearSelect.appendChild(opt);
            }
            for (let i = 1; i <= 12; i++) {
                const opt = document.createElement('option'); opt.value = i - 1; opt.innerText = i; monthSelect.appendChild(opt);
            }
        }

        async function fetchAndRender() {
            try {
                if (allEvents.length === 0) {
                    const response = await fetch(url);
                    allEvents = await response.json();
                }
                renderTable();
            } catch (e) { console.error(e); }
        }

        const fmt = (t) => {
            if(!t || t === 'undefined' || t === '--:--' || t === '00:00') return ''; 
            const d = new Date(t);
            return isNaN(d.getTime()) ? (t === '00:00' || t === '--:--' ? '' : t) : d.getHours().toString().padStart(2,'0')+':'+d.getMinutes().toString().padStart(2,'0');
        };

        const genCol = (arr) => arr.map(c => `<div class="event-item">${c}</div>`).join('');

        function renderTable() {
            const year = currentViewDate.getFullYear();
            const month = currentViewDate.getMonth();
            const lastDay = new Date(year, month + 1, 0).getDate();
            const days = ['日','月','火','水','木','金','土'];
            
            document.getElementById('select-year').value = year;
            document.getElementById('select-month').value = month;
            const tableBody = document.getElementById('table-body');
            tableBody.innerHTML = '';

            for (let day = 1; day <= lastDay; day++) {
                const dateObj = new Date(year, month, day);
                const dayW = days[dateObj.getDay()];
                const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                const dayEvents = allEvents.filter(e => e.start.startsWith(dateStr));
                
                const tr = document.createElement('tr');
                if(dateObj.getDay() === 0) tr.classList.add('row-sun');
                if(dateObj.getDay() === 6) tr.classList.add('row-sat');

                if (dayEvents.length > 0) {
                    tr.classList.add('has-event');
                    // 日付リンクをクリックした時はモーダルを開かない
                    tr.onclick = (e) => { 
                        if (!e.target.closest('.date-link')) openModal(dayEvents); 
                    };
                    tr.innerHTML = `
                        <td class="col-date"><a href="attendance.html?date=${dateStr}" class="date-link">${day}(${dayW})</a></td>
                        <td class="col-type">${genCol(dayEvents.map(e => `<span class="type-tag">${e.extendedProps.type || '予定'}</span>`))}</td>
                        <td class="col-time">${genCol(dayEvents.map(e => {
                            const s = fmt(e.extendedProps.startTime), ed = fmt(e.extendedProps.endTime);
                            return s || ed ? `<span class="text-blue-600">${s}〜${ed}</span>` : '<span class="invisible">-</span>';
                        }))}</td>
                        <td class="col-target">${genCol(dayEvents.map(e => e.title || ''))}</td>
                        <td class="col-name">${genCol(dayEvents.map(e => e.extendedProps.eventName || ''))}</td>
                        <td class="col-loc">${genCol(dayEvents.map(e => e.extendedProps.location || '-'))}</td>
                    `;
                } else {
                    tr.innerHTML = `<td class="col-date"><span>${day}(${dayW})</span></td><td colspan="5" class="text-center text-gray-300 text-xs">---</td>`;
                }
                tableBody.appendChild(tr);
            }
        }

        function changeMonth(diff) { currentViewDate.setMonth(currentViewDate.getMonth() + diff); renderTable(); }
        function jumpToDate() { currentViewDate = new Date(document.getElementById('select-year').value, document.getElementById('select-month').value, 1); renderTable(); }
        
        function openModal(dayEvents) {
            const container = document.getElementById('modal-events-container');
            container.innerHTML = '';
            const rawDate = dayEvents[0].start.split('T')[0];
            const dateParts = rawDate.split('-');
            document.getElementById('modal-date-display').innerText = `${dateParts[0]}年${dateParts[1]}月${dateParts[2]}日`;
            
            dayEvents.forEach(event => {
                const p = event.extendedProps;
                const s = fmt(p.startTime), ed = fmt(p.endTime);
                const card = document.createElement('div');
                card.className = 'modal-event-card';
                card.innerHTML = `
                    <div class="m-info-group">
                        <div class="m-icon-box"><span class="m-type-emoji">👥</span></div>
                        <div class="m-text-box"><span class="m-label">対象</span><span class="m-value m-value-highlight">${event.title || '---'}</span></div>
                    </div>
                    <div class="m-info-group">
                        <div class="m-icon-box"><span class="m-type-emoji">📋</span></div>
                        <div class="m-text-box"><span class="m-label">種別</span><span class="m-value">${p.type || '予定'}</span></div>
                    </div>
                    ${s || ed ? `<div class="m-info-group">
                        <div class="m-icon-box"><span class="m-type-emoji">🕒</span></div>
                        <div class="m-text-box"><span class="m-label">時間</span><span class="m-value font-bold text-blue-600">${s} 〜 ${ed}</span></div>
                    </div>` : ''}
                    <div class="m-info-group">
                        <div class="m-icon-box"><span class="m-type-emoji">📝</span></div>
                        <div class="m-text-box"><span class="m-label">内容</span><span class="m-value m-value-highlight">${p.eventName || '---'}</span></div>
                    </div>
                    <div class="m-info-group">
                        <div class="m-icon-box"><span class="m-type-emoji">📍</span></div>
                        <div class="m-text-box"><span class="m-label">場所</span><span class="m-value">${p.location || '---'}</span></div>
                    </div>
                `;
                container.appendChild(card);
            });
            document.getElementById('event-modal').classList.add('show');
        }

        function closeModal() { document.getElementById('event-modal').classList.remove('show'); }
        initSelects();
        fetchAndRender();
    </script>
</body>
</html>
