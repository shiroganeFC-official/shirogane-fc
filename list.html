<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>予定一覧 | オープンキャンパス</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Noto Sans JP', sans-serif; background-color: #f9fafb; margin: 0; padding: 10px; overflow-x: hidden; }
        
        .fixed-header { position: sticky; top: 0; background-color: #f9fafb; z-index: 30; padding-bottom: 10px; }
        .header-top { max-width: 1000px; margin: 10px auto 10px; display: flex; justify-content: space-between; align-items: center; }
        .back-btn { font-size: 0.8rem; color: #2563eb; font-weight: 700; text-decoration: none; border: 1px solid #2563eb; padding: 4px 10px; border-radius: 20px; transition: all 0.2s; }
        .back-btn:hover { background: #2563eb; color: white; }

        .schedule-nav { max-width: 1000px; margin: 0 auto; display: flex; justify-content: center; align-items: center; gap: 8px; }
        .nav-btn { background: #fff; border: 1px solid #e5e7eb; padding: 4px 10px; border-radius: 8px; font-weight: 900; color: #2563eb; transition: all 0.2s; }
        .nav-btn:hover { background: #2563eb; color: white; }
        
        .select-date { font-size: clamp(1rem, 4vw, 1.3rem); font-weight: 900; color: #111827; background: transparent; border: none; outline: none; cursor: pointer; border-radius: 6px; }
        .select-date:hover { background: #e5e7eb; }

        .table-container { max-width: 1000px; margin: 0 auto; background: white; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        table { width: 100%; border-collapse: separate; border-spacing: 0; table-layout: fixed; } 
        
        th { 
            position: sticky; top: 105px; 
            background-color: #111827 !important; 
            padding: 12px 4px; 
            font-size: clamp(0.65rem, 2.5vw, 0.95rem); 
            color: #ffffff !important; 
            font-weight: 900 !important;
            border-bottom: 2px solid #000; 
            text-align: left; z-index: 15;
            opacity: 1 !important;
        }

        td { padding: 10px 4px; border-bottom: 1px solid #f3f4f6; vertical-align: top; font-size: clamp(0.7rem, 2.5vw, 0.95rem); line-height: 1.3; text-align: left; }

        /* 複数予定の区切り点線スタイル */
        .event-item { padding: 4px 0; }
        .event-item + .event-item { border-top: 1px dashed #e5e7eb; margin-top: 4px; padding-top: 8px; }

        .col-date   { width: 14%; text-align: right; padding-right: 8px; font-weight: 900; }
        .col-type   { width: 10%; text-align: center; }
        .col-time   { width: 18%; font-weight: 700; }
        .col-target { width: 20%; font-weight: 800; color: #111827; }
        .col-name   { width: 24%; color: #374151; font-weight: 500; } 
        .col-loc    { width: 15%; color: #6b7280; } 

        .date-link { color: #2563eb; text-decoration: underline; font-weight: 900; }
        .date-text { font-weight: 900; color: #111827; }

        .row-sun td { background-color: #fff1f2 !important; color: #ef4444; }
        .row-sat td { background-color: #eff6ff !important; color: #3b82f6; }
        
        .type-tag { display: inline-block; background: #e0e7ff; color: #4338ca; padding: 1px 4px; border-radius: 4px; font-size: 0.65rem; font-weight: 800; line-height: 1.2; }
        @media (max-width: 767px) {
            .type-text { display: none; }
            .type-icon { display: inline-block; font-size: 1.1rem; }
            .type-tag { background: transparent; padding: 0; }
        }
        @media (min-width: 768px) { .type-icon { display: none; } }

        .has-event { cursor: pointer; }
        .empty-text { color: #d1d5db; font-size: 0.75rem; text-align: center; padding: 20px 0; }

        #event-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.8); z-index: 9999; display: flex; align-items: center; justify-content: center; visibility: hidden; opacity: 0; transition: opacity 0.3s, visibility 0.3s; }
        #event-modal.show { visibility: visible; opacity: 1; }
        .modal-content { background: white; width: 95%; max-width: 440px; padding: 24px 20px; border-radius: 28px; transform: scale(0.9); transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1); max-height: 90vh; overflow-y: auto; }
        .event-card { text-align: left; }
        .event-card + .event-card { margin-top: 30px; padding-top: 30px; border-top: 2px dashed #e5e7eb; }
        .info-group { margin-bottom: 15px; }
        .info-label { display: block; font-size: 13px; font-weight: 800; color: #6b7280; margin-bottom: 3px; }
        .info-value { display: block; font-size: 1.1rem; font-weight: 700; color: #1f2937; line-height: 1.4; }
        .highlight-value { border-left: 5px solid #2563eb; padding-left: 12px; font-size: 1.2rem; }
        .close-btn { margin-top: 20px; width: 100%; background: #111827; color: white; padding: 16px; border-radius: 18px; font-weight: 700; font-size: 1.1rem; }
    </style>
</head>
<body>

    <div class="fixed-header">
        <div class="header-top">
            <h1 class="text-xl font-black">予定一覧</h1>
            <a href="calendar.html" class="back-btn">← 戻る</a>
        </div>
        <div class="schedule-nav">
            <button class="nav-btn" onclick="changeMonth(-1)">＜</button>
            <div class="flex items-center">
                <select id="select-year" class="select-date" onchange="jumpToDate()"></select>
                <span class="font-black mr-1 ml-1">年</span>
                <select id="select-month" class="select-date" onchange="jumpToDate()"></select>
                <span class="font-black ml-1">月</span>
            </div>
            <button class="nav-btn" onclick="changeMonth(1)">＞</button>
        </div>
    </div>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th class="col-date">日付</th>
                    <th class="col-type">種別</th>
                    <th class="col-time">時間</th>
                    <th class="col-target">対象</th>
                    <th class="col-name">内容</th>
                    <th class="col-loc">場所</th>
                </tr>
            </thead>
            <tbody id="table-body"></tbody>
        </table>
    </div>

    <div id="event-modal">
        <div class="modal-content text-center">
            <div id="modal-date-display" class="text-2xl font-black mb-8 text-gray-900 border-b-4 border-blue-600 inline-block px-2"></div>
            <div id="modal-events-container"></div>
            <button onclick="closeModal()" class="close-btn">閉じる</button>
        </div>
    </div>

    <script>
        const url = 'https://script.google.com/macros/s/AKfycbwTNgQ4Axd7QzTxj5zMTM9zYFlpsGiuTz1AxDjfFOu76O2M1OtDUTAH6-pY7duotm7Eow/exec';
        let currentViewDate = new Date(); 
        let allEvents = [];

        const typeIconMap = {
            '通常練習': '🏃', '体育館練習': '🏠', '公園練習': '🌳', 
            '練習試合': '⚽', '大会': '🏆', '学校イベント': '🏫', '休み': '☕'
        };

        function initSelects() {
            const yearSelect = document.getElementById('select-year');
            const monthSelect = document.getElementById('select-month');
            const currentYear = new Date().getFullYear();
            for (let i = currentYear - 1; i <= currentYear + 2; i++) {
                const opt = document.createElement('option');
                opt.value = i; opt.innerText = i;
                yearSelect.appendChild(opt);
            }
            for (let i = 1; i <= 12; i++) {
                const opt = document.createElement('option');
                opt.value = i - 1; opt.innerText = i;
                monthSelect.appendChild(opt);
            }
        }

        async function fetchAndRender() {
            try {
                if (allEvents.length === 0) {
                    const response = await fetch(url);
                    allEvents = await response.json();
                }
                renderTable();
            } catch (e) { console.error(e); }
        }

        function renderTable() {
            const year = currentViewDate.getFullYear();
            const month = currentViewDate.getMonth();
            const lastDay = new Date(year, month + 1, 0).getDate();
            const days = ['日','月','火','水','木','金','土'];
            
            document.getElementById('select-year').value = year;
            document.getElementById('select-month').value = month;

            const tableBody = document.getElementById('table-body');
            tableBody.innerHTML = '';

            const fmt = (t) => {
                if(!t || t === 'undefined' || t === '--:--' || t === '00:00') return ''; 
                const d = new Date(t);
                return isNaN(d.getTime()) ? (t === '00:00' || t === '--:--' ? '' : t) : d.getHours().toString().padStart(2,'0')+':'+d.getMinutes().toString().padStart(2,'0');
            };

            const genCol = (arr) => arr.map(c => `<div class="event-item">${c}</div>`).join('');

            for (let day = 1; day <= lastDay; day++) {
                const dateObj = new Date(year, month, day);
                const dayW = days[dateObj.getDay()];
                const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                const dayEvents = allEvents.filter(e => e.start.startsWith(dateStr));
                
                const tr = document.createElement('tr');
                if(dateObj.getDay() === 0) tr.classList.add('row-sun');
                if(dateObj.getDay() === 6) tr.classList.add('row-sat');

                if (dayEvents.length > 0) {
                    tr.classList.add('has-event');
                    const attUrl = `attendance.html?date=${dateStr}`;
                    tr.onclick = (e) => { if (!e.target.classList.contains('date-link')) openModal(dayEvents); };

                    tr.innerHTML = `
                        <td class="col-date"><a href="${attUrl}" class="date-link">${day}(${dayW})</a></td>
                        <td class="col-type">${genCol(dayEvents.map(e => {
                            const type = e.extendedProps.type || '予定';
                            const icon = typeIconMap[type] || '🗓️';
                            return `<span class="type-tag"><span class="type-icon">${icon}</span><span class="type-text">${type}</span></span>`;
                        }))}</td>
                        <td class="col-time">${genCol(dayEvents.map(e => {
                            const start = fmt(e.extendedProps.startTime);
                            const end = fmt(e.extendedProps.endTime);
                            return start || end ? `<span class="text-blue-600">${start} 〜 ${end}</span>` : '<span class="invisible">-</span>';
                        }))}</td>
                        <td class="col-target">${genCol(dayEvents.map(e => e.title || ''))}</td>
                        <td class="col-name">${genCol(dayEvents.map(e => e.extendedProps.eventName || ''))}</td>
                        <td class="col-loc">${genCol(dayEvents.map(e => {
                            const loc = e.extendedProps.location;
                            return (loc === '---' || !loc) ? '<span class="invisible">-</span>' : loc;
                        }))}</td>
                    `;
                } else {
                    tr.innerHTML = `
                        <td class="col-date"><span class="date-text">${day}(${dayW})</span></td>
                        <td colspan="5" class="empty-text">---</td>
                    `;
                }
                tableBody.appendChild(tr);
            }
        }

        function changeMonth(diff) { currentViewDate.setMonth(currentViewDate.getMonth() + diff); renderTable(); }
        function jumpToDate() { currentViewDate = new Date(document.getElementById('select-year').value, document.getElementById('select-month').value, 1); renderTable(); }
        function closeModal() { document.getElementById('event-modal').classList.remove('show'); }

        function openModal(dayEvents) {
            const container = document.getElementById('modal-events-container');
            container.innerHTML = '';
            const fmt = (t) => {
                if(!t || t === '--:--' || t === '00:00') return '';
                const d = new Date(t);
                return isNaN(d.getTime()) ? t : d.getHours().toString().padStart(2,'0')+':'+d.getMinutes().toString().padStart(2,'0');
            };
            document.getElementById('modal-date-display').innerText = dayEvents[0].start.split('T')[0];
            dayEvents.forEach(event => {
                const p = event.extendedProps;
                const start = fmt(p.startTime);
                const end = fmt(p.endTime);
                const loc = (p.location === '---') ? '' : p.location;
                const card = document.createElement('div');
                card.className = 'event-card';
                card.innerHTML = `
                    <div class="info-group"><span class="info-label">種別</span><div class="mt-1"><span class="type-tag">${p.type || '予定'}</span></div></div>
                    ${start || end ? `<div class="info-group"><span class="info-label">時間</span><span class="info-value text-blue-600">${start} 〜 ${end}</span></div>` : ''}
                    <div class="info-group">
                        <span class="info-label">対象</span>
                        <span class="info-value highlight-value">${event.title || '---'}</span>
                    </div>
                    <div class="info-group">
                        <span class="info-label">内容（イベント名）</span>
                        <span class="info-value">${p.eventName || '---'}</span>
                    </div>
                    ${loc ? `<div class="info-group"><span class="info-label">場所</span><span class="info-value">${loc}</span></div>` : ''}
                    ${p.remarks && p.remarks !== '---' ? `<div class="info-group"><span class="info-label">備考</span><span class="info-value font-normal text-gray-500 text-sm">${p.remarks}</span></div>` : ''}
                `;
                container.appendChild(card);
            });
            document.getElementById('event-modal').classList.add('show');
        }

        initSelects();
        fetchAndRender();
    </script>
</body>
</html>
